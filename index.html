<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Digital Twin Monitoring</title>
    
    <!-- FIX: Link CSS Video.js yang lengkap -->
    <link href="https://unpkg.com" rel="stylesheet">
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #1a1a1a; 
            color: white; 
            padding-top: 50px; 
            margin: 0;
        }
        .video-container { 
            display: flex; 
            justify-content: center; 
            margin-top: 20px; 
        }
        .info-text {
            color: #aaa;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h3>Live CCTV Snapshot (Update Tiap 1 Menit)</h3>
    
    <div class="video-container">
        <video id="cctv-player" class="video-js vjs-default-skin vjs-big-play-centered" width="640" height="360" controls preload="auto">
            <!-- FIX: URL Cloudflare R2 yang sudah diarahkan ke file /playlist.m3u8 -->
            <source src="https://pub-b603cfaa840249e88af38c65a0b635cb.r2.dev/playlist.m3u8" type="application/x-mpegURL">
        </video>
    </div>
    
    <p class="info-text">Halaman akan memuat ulang klip video terbaru secara otomatis setiap 60 detik.</p>

    <!-- FIX: Link Script Video.js yang lengkap -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // Inisialisasi pemutar video
        var player = videojs('cctv-player');
        
        // Mute video agar fitur autoplay diizinkan oleh sistem browser
        player.muted(true); 
        player.play();

        // Fitur auto-refresh klip video setiap 60 detik tanpa memicu cache browser
        setInterval(function() {
            console.log("Memuat ulang klip CCTV terbaru...");
            var currentSource = player.currentSrc();
            var baseUrl = currentSource.split('?')[0]; 
            
            player.src({
                src: baseUrl + '?t=' + new Date().getTime(),
                type: 'application/x-mpegURL'
            });
            
            player.ready(function() {
                player.play();
            });
        }, 60000);
    </script>
</body>
</html>
